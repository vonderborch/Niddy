name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets NuGet/login exchange a GitHub OIDC token for a short-lived nuget.org API key (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The release tag is the package version (SemVer 2), e.g. v1.2.0 or v1.3.0-beta.1. A leading "v" is optional.
      - name: Get version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::Release tag '$TAG' is not a SemVer version (expected e.g. v1.2.0 or v1.3.0-beta.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./artifacts

      # Trusted publishing: no stored API key. The key this returns is valid for one hour, so get it right before pushing.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (not the email address)

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
